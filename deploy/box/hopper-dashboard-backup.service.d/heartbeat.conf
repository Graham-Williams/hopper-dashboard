# hopper-dashboard heartbeat for hopper-dashboard-backup.service (installed by
# deploy/box/install.sh to /etc/systemd/system/hopper-dashboard-backup.service.d/).
#
# ⚠️ THE TIMER IS NEVER INSTALLED WITHOUT THIS FILE. An unmonitored backup is the exact
# failure this whole repo exists to catch: it fails silently, the board keeps showing the job
# as it last was, and nobody finds out until a restore is needed.
#
# ExecStopPost= runs after ExecStart finishes — on success, on non-zero exit AND after the
# TimeoutStartSec kill — with $SERVICE_RESULT / $EXIT_CODE / $EXIT_STATUS set by systemd
# (systemd.exec(5)). ${VAR} from EnvironmentFile= is expanded by systemd before exec, so no
# shell is needed. The leading '-' on both lines means a missing env file or a failed curl
# must NOT change the unit's own result. The dashboard maps result=success → ok, anything
# else → fail with reason=<result>.
#
# ⚠️ THE TOKEN IS NOT ON THE COMMAND LINE, and that is the one difference from the km-backup /
# todoist-points-backup drop-ins. systemd expands ${INGEST_TOKEN} at exec time, so writing
# `-H "Authorization: Bearer ${INGEST_TOKEN}"` puts the credential in the child's argv and
# therefore in /proc/<pid>/cmdline — world-readable on a default Ubuntu, for the lifetime of
# the request, on every tick. (The journal is NOT affected: systemd logs the argv unexpanded.)
# Instead curl reads the header from a config file it opens itself:
#
#   /etc/hopper-dashboard/ingest.curlrc   owned by the unit's User=, mode 0600, written by
#                                         deploy/box/install.sh from the same INGEST_TOKEN
#
# That file must be readable by the service user, unlike root-only ingest.env — which costs
# nothing, because that user already owns ~/hopper-dashboard/.env where INGEST_TOKEN comes
# from. DASHBOARD_URL stays in the env file: it is not a secret and it is not in the curlrc.
[Service]
EnvironmentFile=-/etc/hopper-dashboard/ingest.env
ExecStopPost=-/usr/bin/curl -fsS -m 10 --retry 2 -K /etc/hopper-dashboard/ingest.curlrc -X POST --data-urlencode "result=${SERVICE_RESULT}" --data-urlencode "exit=${EXIT_STATUS}" --data-urlencode "exit_code=${EXIT_CODE}" ${DASHBOARD_URL}/api/v1/ping/hopper-dashboard-backup

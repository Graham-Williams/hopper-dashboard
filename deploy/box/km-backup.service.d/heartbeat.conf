# hopper-dashboard heartbeat for km-backup.service (installed by deploy/box/install.sh to
# /etc/systemd/system/km-backup.service.d/heartbeat.conf). A drop-in, so it survives `git pull`
# in ~/km-tracker and never edits that repo's unit or script.
#
# ExecStopPost= runs after ExecStart finishes — on success, on non-zero exit AND after the
# TimeoutStartSec=300 kill — with $SERVICE_RESULT / $EXIT_CODE / $EXIT_STATUS set by systemd
# (systemd.exec(5)). ${VAR} from EnvironmentFile= is expanded by systemd before exec, so no
# shell is needed. The leading '-' on both lines means: a missing env file or a failed curl
# must NOT change the unit's own result. curl -f turns a non-2xx into a non-zero exit (ignored).
# Works under User=<login> + NoNewPrivileges + PrivateTmp: systemd (PID 1) reads the env file as
# root, then curl runs as graham with the values already in its environment.
# The dashboard maps result=success → ok, anything else → fail with reason=<result>.
[Service]
EnvironmentFile=-/etc/hopper-dashboard/ingest.env
ExecStopPost=-/usr/bin/curl -fsS -m 10 --retry 2 -X POST -H "Authorization: Bearer ${INGEST_TOKEN}" --data-urlencode "result=${SERVICE_RESULT}" --data-urlencode "exit=${EXIT_STATUS}" --data-urlencode "exit_code=${EXIT_CODE}" ${DASHBOARD_URL}/api/v1/ping/km-backup

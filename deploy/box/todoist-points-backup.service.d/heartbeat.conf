# hopper-dashboard heartbeat for todoist-points-backup.service (installed by deploy/box/install.sh
# to /etc/systemd/system/todoist-points-backup.service.d/heartbeat.conf). See the km-backup
# drop-in for the full rationale: ExecStopPost fires on success, failure and timeout; '-' prefixes
# keep a missing env file / failed curl from altering the unit's result.
[Service]
EnvironmentFile=-/etc/hopper-dashboard/ingest.env
ExecStopPost=-/usr/bin/curl -fsS -m 10 --retry 2 -X POST -H "Authorization: Bearer ${INGEST_TOKEN}" --data-urlencode "result=${SERVICE_RESULT}" --data-urlencode "exit=${EXIT_STATUS}" --data-urlencode "exit_code=${EXIT_CODE}" ${DASHBOARD_URL}/api/v1/ping/todoist-points-backup

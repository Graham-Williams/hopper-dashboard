name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow token: nothing here writes to the repo.
permissions:
  contents: read

# Actions are pinned by commit SHA (a moving tag can be re-pointed at malicious code).
# Refresh with: gh api repos/actions/<action>/git/ref/tags/<tag> --jq .object.sha

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Probe tests must stay stdlib-only
        # Same interpreter, but with the app's third-party deps hidden: the Mac/box probes run
        # under a stock python3 with no venv, so they must import nothing but the stdlib.
        run: |
          python -m venv /tmp/bare && /tmp/bare/bin/pip install -q pytest==9.0.3
          /tmp/bare/bin/python -m pytest -q tests/test_probes_*.py

  probes-py39:
    # The step above proves "stdlib only" but NOT "3.9 compatible": it runs 3.12, so 3.10+ syntax
    # (match, `X | Y` annotations without a __future__ import, …) sails through. probes/ runs under
    # macOS's stock /usr/bin/python3 — 3.9.6, no venv — from launchd, where a SyntaxError is a silent
    # hourly failure. compileall parses every file without importing anything; the probe suites then RUN
    # them, which is what catches 3.10-only behaviour that parses fine (e.g. `int | None` evaluated outside
    # an annotation). Those suites are stdlib-only by design, so pytest is the only install needed.
    # If 3.9 is ever dropped from the runner image, pin `runs-on: ubuntu-22.04` rather than deleting this.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: probes/ must parse under Python 3.9
        # -f: without it compileall skips any file whose __pycache__ is already up to date.
        run: python -m compileall -qf probes/
      - name: probes/ must also RUN under Python 3.9
        # Probe suites only. The dashboard package is 3.12-only (it runs in the container), and
        # running the whole suite here fails on two of its tests for that reason alone.
        # pytest is pinned to 9.0.3 in requirements-dev.txt, but that release requires
        # Python >= 3.10, so it CANNOT be installed here. 8.4.2 is the newest release that
        # still supports 3.9. The pin is intentionally different from the rest of CI and must
        # stay a `<9` release for as long as this job targets 3.9.
        run: |
          pip install -q "pytest==8.4.2"
          python -m pytest -q tests/test_probes_*.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t hopper-dashboard:ci .
      - name: Smoke both roles
        run: |
          set -eu
          cp jobs.example.yml jobs.yml
          # A root-owned 0600 rclone.conf, exactly like the box: the entrypoint must stage it
          # as root and then drop to the app user.
          printf '[gdrive]\ntype = drive\nscope = drive.readonly\n' > rclone.conf
          sudo chown root:root rclone.conf && sudo chmod 0600 rclone.conf
          docker run -d --name hd --read-only --tmpfs /tmp:mode=1777,size=64m -v /app/data \
            -v "$PWD/jobs.yml:/app/jobs.yml:ro" -v "$PWD/rclone.conf:/rclone/rclone.conf:ro" \
            -e INGEST_TOKEN=ci-token -e READ_TOKEN=ci-read -e APP_PASSWORD=ci-pass -e SESSION_SECRET=ci-secret \
            -e DASHBOARD_NO_SCHEDULER=1 \
            -p 8080:8080 -p 8081:8081 hopper-dashboard:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null && curl -sf http://127.0.0.1:8081/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8081/healthz
          # Gate redirects the board; a ping without a token is 401; a token'd ping is 200.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/v1/ping/km-backup)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer ci-token' -d result=success http://127.0.0.1:8081/api/v1/ping/km-backup)" = "200"
          # The read role has no ping route (ingest isolation); the ingest role has no static route.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer ci-read' http://127.0.0.1:8080/api/v1/ping/km-backup)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/static/app.css)" = "404"
          # Nothing runs as root after start-up; the staged conf belongs to the app user.
          # `-u 10001`: docker exec itself runs as root by default, so the checker would otherwise be the
          # one root process it finds. Run it as the app user and require that uid 0 is simply absent.
          docker exec -u 10001 hd sh -c 'for p in /proc/[0-9]*; do stat -c %u "$p"; done | sort -u' | tee /tmp/uids
          test "$(grep -vc '^0$' /tmp/uids)" -ge 1
          ! grep -qx 0 /tmp/uids
          docker exec -u 10001 hd stat -c '%u %a' /tmp/rclone/rclone.conf | grep -q '^10001 600$'
          # The privilege drop emptied the bounding set: no capability can ever be re-acquired.
          docker exec -u 10001 hd sh -c 'grep -E "^Cap(Bnd|Eff|Prm)" /proc/1/status' | tee /tmp/caps
          test "$(grep -c ':\s*0000000000000000$' /tmp/caps)" = 3
          # APP_USER=root must be refused, not looped through the root branch forever.
          docker run --rm --read-only --tmpfs /tmp -v "$PWD/jobs.yml:/app/jobs.yml:ro" \
            -e APP_USER=root -e INGEST_TOKEN=x -e READ_TOKEN=x -e APP_PASSWORD=x -e SESSION_SECRET=x \
            hopper-dashboard:ci 2>&1 | tee /tmp/root-run || true
          grep -q 'must be an existing non-root user' /tmp/root-run
          docker logs hd
          docker rm -f hd
      - name: backup.sh snapshots the real container (read_only + tmpfs /tmp, like the box)
        # The box's container is read_only with a TMPFS /tmp, and `docker cp` cannot read a
        # tmpfs: every real backup run failed while the fakes let the suite pass. This runs
        # backup.sh's DB snapshot for real against the built image with the same settings, on
        # its local-only path (no RCLONE_DEST), and checks what it kept.
        run: |
          set -eu
          cp jobs.example.yml jobs.yml
          docker run -d --name hdb --read-only --tmpfs /tmp:mode=1777,size=64m -v /app/data \
            -v "$PWD/jobs.yml:/app/jobs.yml:ro" \
            -e INGEST_TOKEN=ci-token -e READ_TOKEN=ci-read -e APP_PASSWORD=ci-pass -e SESSION_SECRET=ci-secret \
            -e DASHBOARD_NO_SCHEDULER=1 hopper-dashboard:ci
          for i in $(seq 1 30); do
            if docker exec hdb test -f /app/data/inbox.db && docker exec hdb test -f /app/data/dashboard.db; then
              break
            fi
            sleep 1
          done
          BACKUP_CONTAINER=hdb BACKUP_ROOT="$RUNNER_TEMP/backups" BACKUP_AUDIO=0 deploy/box/backup.sh
          snaps="$RUNNER_TEMP/backups/snapshots"
          test "$(ls "$snaps"/dashboard_*.db | wc -l)" -eq 1
          test "$(ls "$snaps"/inbox_*.db | wc -l)" -eq 1
          test -z "$(ls -A "$snaps" | grep '^\.' || true)"
          for f in "$snaps"/*.db; do
            python3 -c 'import sqlite3, sys; c = sqlite3.connect("file:%s?mode=ro&immutable=1" % sys.argv[1], uri=True); assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; assert c.execute("SELECT count(*) FROM sqlite_master").fetchone()[0] > 0' "$f"
          done
          # Nothing left on the container's tmpfs.
          test -z "$(docker exec hdb ls -A /tmp)"
          # The audio tree IS copied with docker cp: that works because it is on the data volume.
          docker exec hdb sh -c 'mkdir -p /app/data/inbox/audio/2026/09 && echo x > /app/data/inbox/audio/2026/09/ci.webm'
          mkdir -p "$RUNNER_TEMP/audio"
          docker cp hdb:/app/data/inbox/audio/. "$RUNNER_TEMP/audio/"
          test -f "$RUNNER_TEMP/audio/2026/09/ci.webm"
          docker logs hdb
          docker rm -fv hdb
      - name: HTTPS upgrade must actually be exercised (APP_HOST set)
        # The container above runs WITHOUT APP_HOST, which DISABLES the http->https
        # redirect — so its `/` = 302 and `/static/app.css` = 404 checks pass for the
        # wrong reason: they would stay green with the redirect completely broken.
        # This second container sets APP_HOST and asserts the upgrade itself.
        run: |
          set -eu
          H='Host: hub.ci.example'
          docker run -d --name hd3 --read-only --tmpfs /tmp:mode=1777,size=64m -v /app/data \
            -v "$PWD/jobs.yml:/app/jobs.yml:ro" \
            -e INGEST_TOKEN=ci-token -e READ_TOKEN=ci-read -e APP_PASSWORD=ci-pass -e SESSION_SECRET=ci-secret \
            -e APP_HOST=hub.ci.example -e APP_LEGACY_HOSTS=dashboard.ci.example -e DASHBOARD_NO_SCHEDULER=1 \
            -p 8082:8080 -p 8083:8081 hopper-dashboard:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8082/healthz >/dev/null && curl -sf http://127.0.0.1:8083/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          # X-Forwarded-Proto: http -> 307 to the PINNED host (never the request's own).
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H "$H" -H 'X-Forwarded-Proto: http' http://127.0.0.1:8082/)" \
            = "307 https://hub.ci.example/"
          # ...and it must be uncacheable + Vary'd, or a self-referential redirect
          # could be stored by a shared cache / stick in a browser forever.
          curl -s -D- -o /dev/null -H "$H" -H 'X-Forwarded-Proto: http' http://127.0.0.1:8082/ > /tmp/redir
          grep -qi '^cache-control: no-store' /tmp/redir
          grep -qi '^vary:.*[Xx]-[Ff]orwarded-[Pp]roto' /tmp/redir
          grep -qi '^strict-transport-security: max-age=31536000' /tmp/redir
          # A crafted Host is never reflected into Location (open-redirect guard).
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Host: evil.example' -H 'X-Forwarded-Proto: http' http://127.0.0.1:8082/)" \
            = "https://hub.ci.example/"
          # With NO X-Forwarded-Proto nothing is redirected: that is what keeps the
          # container HEALTHCHECK and Hopper's in-network read working.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" http://127.0.0.1:8082/)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/healthz)" = "200"
          # THE INGEST ROLE MUST NEVER REDIRECT, whatever is forwarded — a 301/307 on
          # :8081 stops every heartbeat silently and makes the whole board lie.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Forwarded-Proto: http' \
            -H 'Authorization: Bearer ci-token' -d result=success http://127.0.0.1:8083/api/v1/ping/km-backup)" = "200"
          test -z "$(curl -s -o /dev/null -w '%{redirect_url}' -X POST -H 'X-Forwarded-Proto: http' \
            -H 'Authorization: Bearer ci-token' -d result=success http://127.0.0.1:8083/api/v1/ping/km-backup)"
          # The LEGACY host only redirects: 307 for every method (never 301 — a wrong
          # APP_HOST must not stick in browsers), path+query kept, no-store, and
          # /healthz still answers on it.
          L='Host: dashboard.ci.example'
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H "$L" 'http://127.0.0.1:8082/inbox?q=a%2Fb')" \
            = "307 https://hub.ci.example/inbox?q=a%2Fb"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -X POST -H "$L" http://127.0.0.1:8082/login)" \
            = "307 https://hub.ci.example/login"
          curl -s -D- -o /dev/null -H "$L" http://127.0.0.1:8082/ | grep -qi '^cache-control: no-store'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$L" http://127.0.0.1:8082/healthz)" = "200"
          docker logs hd3
          docker rm -f hd3

  read-role-fails-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t hopper-dashboard:ci .
      - name: Prod without APP_PASSWORD must not come up
        run: |
          set -eu
          cp jobs.example.yml jobs.yml
          docker run -d --name hd2 --read-only --tmpfs /tmp -v /app/data -v "$PWD/jobs.yml:/app/jobs.yml:ro" \
            -e INGEST_TOKEN=ci-token -e DASHBOARD_NO_SCHEDULER=1 hopper-dashboard:ci
          sleep 8
          # entrypoint exits when a gunicorn dies → container is not running
          test "$(docker inspect -f '{{.State.Running}}' hd2)" = "false"
          docker logs hd2 2>&1 | grep -q "APP_PASSWORD is empty"
          docker rm -f hd2

  # ---------------------------------------------------------------------------
  # Dependabot auto-merge.
  #
  # THE GATE IS `needs:`, NOT BRANCH PROTECTION. GitHub's native auto-merge
  # (`gh pr merge --auto`) only waits for checks that branch protection marks
  # as *required* — and none of Graham's repos define required checks (one is
  # private, where the plan offers no branch protection or rulesets at all). On
  # such a repo `--auto` degrades to "merge immediately", which would merge a
  # PR whose tests never ran. Depending on the test job in this same workflow
  # run instead behaves identically everywhere: this job is simply unreachable
  # unless every job it needs has already succeeded.
  #
  # Consequences worth keeping:
  #   * A repo (or a run) with no tests produces no successful `needs:`, so
  #     nothing merges. An absent check can never read as a pass.
  #   * A major version bump always stops for Graham, security advisory or not.
  #   * An empty `update-type` is an ABSENCE of signal, not a pass. The single
  #     exception is a positively-identified Docker digest refresh.
  #
  # Trigger is `pull_request`, NOT `pull_request_target`. `pull_request_target`
  # would run with a write token against a ref the PR author controls; this
  # runs against the PR ref, and GitHub's documented Dependabot recipe grants
  # the write scopes it needs via `permissions:` on `pull_request`. Note also
  # that this job checks out nothing and executes no PR code — the only job
  # that runs repository code is the test job above, which holds a read-only
  # token. A pull_request run from a fork gets a read-only token regardless of
  # the block below, so the write scopes are unreachable from a fork.
  dependabot-auto-merge:
    needs: [test, probes-py39, docker-build, read-role-fails-fast]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Also the authenticity check: this action refuses to emit metadata
      # unless the PR author AND the head commit's author are dependabot[bot]
      # and Dependabot's commit signature verifies. If it refuses, it sets no
      # outputs, so the decision below falls through to "leave for Graham".
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this update may merge itself
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          # Read through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          merge=false
          case "$UPDATE_TYPE" in
            version-update:semver-minor|version-update:semver-patch)
              merge=true
              why="$UPDATE_TYPE, and every check in this run passed"
              ;;
            version-update:semver-major)
              why="a MAJOR version bump — always left for Graham, security advisory or not"
              ;;
            "")
              # No semver level could be derived. Treated as unknown, with one
              # positively-identified exception: a Docker digest refresh, where
              # the tag is unchanged and only the rebuilt image digest moves.
              # That is the upstream security-rebuild stream these repos pin
              # for, and it is recognised by its own shape rather than by the
              # mere absence of a version.
              if [ "$ECOSYSTEM" = "docker" ] && printf '%s' "$PR_TITLE" \
                   | grep -qE 'from `[0-9a-f]{7,40}` to `[0-9a-f]{7,40}`$'; then
                merge=true
                why="Docker digest refresh (same tag, rebuilt image)"
              else
                why="no semver level could be derived, and this is not a digest refresh"
              fi
              ;;
            *)
              why="unrecognised update-type '$UPDATE_TYPE'"
              ;;
          esac
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          if [ "$merge" = true ]; then decision="merging"; else decision="left for Graham"; fi
          {
            echo "### Dependabot auto-merge"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Dependencies | \`${DEP_NAMES:-unknown}\` |"
            echo "| Ecosystem | \`${ECOSYSTEM:-unknown}\` |"
            echo "| update-type | \`${UPDATE_TYPE:-<none>}\` |"
            echo "| Decision | **$decision** |"
            echo "| Because | $why |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Squash-merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
